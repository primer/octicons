name: publish
on:
  workflow_run:
    workflows:
      - release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.packages.outputs.any }}
      octicons: ${{ steps.packages.outputs.octicons }}
      helper: ${{ steps.packages.outputs.helper }}
      jekyll: ${{ steps.packages.outputs.jekyll }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Find unpublished gems
        id: packages
        run: |
          to_ruby_version() {
            if [[ "$1" == 0.0.0-* ]]; then
              echo "${1/0.0.0-/0.0.0.pre.}"
            else
              echo "${1/-rc/.pre}"
            fi
          }

          unpublished() {
            local output=$1
            local package=$2
            local manifest=$3
            local version
            version=$(to_ruby_version "$(node -p "require('./$manifest').version")")

            if [[ -z "$(gem info --remote --exact --version "$version" "$package")" ]]; then
              echo "$output=true" >> "$GITHUB_OUTPUT"
              ANY=true
            else
              echo "$output=false" >> "$GITHUB_OUTPUT"
            fi
          }

          ANY=false
          unpublished octicons octicons lib/octicons_gem/package.json
          unpublished helper octicons_helper lib/octicons_helper/package.json
          unpublished jekyll jekyll-octicons lib/octicons_jekyll/package.json
          echo "any=$ANY" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.packages.outputs.any == 'true' }}
        run: npm ci
      - if: ${{ steps.packages.outputs.any == 'true' }}
        run: |
          npm run build
          cp -r icons lib/build/svg
      - if: ${{ steps.packages.outputs.any == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octicons
          path: ./lib/build

  gem:
    if: ${{ always() && needs.setup.result == 'success' }}
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octicons
          path: ./lib/build
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        name: setup ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        name: Prepare octicons gem
        working-directory: ./lib/octicons_gem
        run: cp -R ../build lib/
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        name: Install dependencies
        working-directory: ./lib/octicons_gem
        run: bundle install
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        name: Build octicons gem
        working-directory: ./lib/octicons_gem
        run: bundle exec rake build
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        name: Publish octicons gem
        working-directory: ./lib/octicons_gem
        run: |
          GEM_PUSH_OUTPUT=$(gem push pkg/*.gem 2>&1) || {
            echo "$GEM_PUSH_OUTPUT"
            echo "$GEM_PUSH_OUTPUT" | grep -q "Repushing of gem versions is not allowed" || exit 1
          }
      - if: ${{ needs.setup.outputs.octicons == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octicons_gem
          path: ./lib/octicons_gem/pkg

  helper:
    if: ${{ always() && needs.setup.result == 'success' && needs.gem.result == 'success' }}
    needs:
      - setup
      - gem
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octicons
          path: ./lib/build
      - if: ${{ needs.setup.outputs.helper == 'true' && needs.setup.outputs.octicons == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octicons_gem
          path: ./lib/octicons_helper/vendor/cache
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: setup ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: Prepare octicons helper gem
        working-directory: ./lib/octicons_helper
        run: cp -R ../build lib/
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: Install dependencies
        working-directory: ./lib/octicons_helper
        run: bundle install
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: Update dependencies
        working-directory: ./lib/octicons_helper
        run: bundle update
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: Build octicons helper gem
        working-directory: ./lib/octicons_helper
        run: bundle exec rake build
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - if: ${{ needs.setup.outputs.helper == 'true' }}
        name: Publish octicons helper gem
        working-directory: ./lib/octicons_helper
        run: |
          GEM_PUSH_OUTPUT=$(gem push pkg/*.gem 2>&1) || {
            echo "$GEM_PUSH_OUTPUT"
            echo "$GEM_PUSH_OUTPUT" | grep -q "Repushing of gem versions is not allowed" || exit 1
          }

  jekyll:
    if: ${{ always() && needs.setup.result == 'success' && needs.gem.result == 'success' }}
    needs:
      - setup
      - gem
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octicons
          path: ./lib/build
      - if: ${{ needs.setup.outputs.jekyll == 'true' && needs.setup.outputs.octicons == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octicons_gem
          path: ./lib/octicons_jekyll/vendor/cache
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: setup ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: Prepare octicons jekyll gem
        working-directory: ./lib/octicons_jekyll
        run: cp -R ../build lib/
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: Install dependencies
        working-directory: ./lib/octicons_jekyll
        run: bundle install
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: Update dependencies
        working-directory: ./lib/octicons_jekyll
        run: bundle update
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: Build octicons jekyll gem
        working-directory: ./lib/octicons_jekyll
        run: bundle exec rake build
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - if: ${{ needs.setup.outputs.jekyll == 'true' }}
        name: Publish octicons jekyll gem
        working-directory: ./lib/octicons_jekyll
        run: |
          GEM_PUSH_OUTPUT=$(gem push pkg/*.gem 2>&1) || {
            echo "$GEM_PUSH_OUTPUT"
            echo "$GEM_PUSH_OUTPUT" | grep -q "Repushing of gem versions is not allowed" || exit 1
          }
