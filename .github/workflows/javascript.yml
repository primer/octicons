name: js
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - run: |
          npm run build
          cp -r icons lib/build/svg
      - uses: actions/upload-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - run: npm ci
      - run: |
          npm run build --workspaces
          npm run lint
          npm run lint --workspaces

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - run: npm ci
      - run: |
          npm run build --workspaces
          npm test
          npm test --workspace=@primer/octicons --workspace=@primer/octicons-react
      - working-directory: ./lib/octicons_react
        run: |
          # Run @arethetypeswrong/cli
          npx -p fflate@0.8.2 -p @arethetypeswrong/cli@0.18.2 attw --pack .

          # Run publint
          npx publint@0.2.12 . --strict
