name: js
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: |
          npm run build
          cp -r icons lib/build/svg
      - uses: actions/upload-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - run: npm ci
      - run: |
          npm run build --workspaces
          npm run lint
          npm run lint:npm --if-present --workspaces

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run build --workspaces
          npm test
          npm run ts-test --workspace=@primer/octicons-react
