name: js
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - run: |
          npm run build
          cp -r icons lib/build/svg
      - uses: actions/upload-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build

  lint:
    name: lint (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: main project
            directory: .
            workspace: false
            build: false
          - name: npm:@primer/octicons
            directory: ./lib/octicons_node
            workspace: true
            build: true
          - name: npm:@primer/octicons-react
            directory: ./lib/octicons_react
            workspace: true
            build: true
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - if: matrix.workspace
        working-directory: ${{ matrix.directory }}
        run: npm ci --include-workspace-root
      - if: ${{ !matrix.workspace }}
        run: npm ci
      - if: matrix.build
        working-directory: ${{ matrix.directory }}
        run: npm run build
      - working-directory: ${{ matrix.directory }}
        run: npm run lint

  test:
    name: test (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: main project
            directory: .
            workspace: false
            build: false
            validate: false
          - name: npm:@primer/octicons
            directory: ./lib/octicons_node
            workspace: true
            build: true
            validate: false
          - name: npm:@primer/octicons-react
            directory: ./lib/octicons_react
            workspace: true
            build: true
            validate: true
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: octicons-build
          path: ./lib/build
      - if: matrix.workspace
        working-directory: ${{ matrix.directory }}
        run: npm ci --include-workspace-root
      - if: ${{ !matrix.workspace }}
        run: npm ci
      - if: matrix.build
        working-directory: ${{ matrix.directory }}
        run: npm run build
      - working-directory: ${{ matrix.directory }}
        run: npm test
      - if: matrix.validate
        working-directory: ${{ matrix.directory }}
        run: |
          # Run @arethetypeswrong/cli
          npx -p fflate@0.8.2 -p @arethetypeswrong/cli@0.18.2 attw --pack .

          # Run publint
          npx publint@0.2.12 . --strict
