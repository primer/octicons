name: JavaScript
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - name: Lint main project
        run: npm run lint
      - name: Lint @primer/octicons
        working-directory: ./lib/octicons_node
        run: npm run lint
      - name: Lint @primer/octicons-react
        working-directory: ./lib/octicons_react
        run: npm run lint
      - name: Lint @primer/styled-octicons
        working-directory: ./lib/octicons_styled
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - name: Build main project
        run: |
          npm run build
          cp -r icons lib/build/svg
      - name: Build @primer/octicons
        working-directory: ./lib/octicons_node
        run: npm run build
      - name: Build @primer/octicons-react
        working-directory: ./lib/octicons_react
        run: npm run build
      - name: Build @primer/styled-octicons
        working-directory: ./lib/octicons_styled
        run: npm run build
      - name: Test main project
        run: npm test
      - name: Test @primer/octicons
        working-directory: ./lib/octicons_node
        run: npm test
      - name: Test @primer/octicons-react
        working-directory: ./lib/octicons_react
        run: npm test
      - name: Test @primer/styled-octicons
        working-directory: ./lib/octicons_styled
        run: npm test
      - name: Validate @primer/octicons-react package
        working-directory: ./lib/octicons_react
        run: |
          # Run @arethetypeswrong/cli
          npx -p fflate@0.8.2 -p @arethetypeswrong/cli@0.18.2 attw --pack .

          # Run publint
          npx publint@0.2.12 . --strict
